name: Fix Google -> Nickname -> Chat auth flow

on:
  push:
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch authentication flow
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_handle = '''  window.handleLogin = function(e) {
    if (e) e.preventDefault();
    const nickInput = document.getElementById('auth-nickname').value.trim();
    const statusInput = document.getElementById('auth-status').value;
    if (!nickInput) return false;
    if (isCloudEnabled && (!auth.currentUser || auth.currentUser.isAnonymous)) {
      currentUser.nickname = nickInput;
      localStorage.setItem('chat_nickname', nickInput);
      loginWithGoogle();
      return false;
    }

    currentUser.nickname = nickInput;
    currentUser.status = statusInput;

    localStorage.setItem('chat_nickname', currentUser.nickname);
    localStorage.setItem('chat_status', currentUser.status);

    startApp();
    return false;
  };'''

          new_handle = '''  window.handleLogin = function(e) {
    if (e) e.preventDefault();
    const nickInput = document.getElementById('auth-nickname').value.trim();
    const statusInput = document.getElementById('auth-status').value;
    if (!nickInput) return false;

    // Cloud mode: Google authentication is mandatory before choosing a nickname.
    if (!(isCloudEnabled && auth && auth.currentUser && !auth.currentUser.isAnonymous)) {
      showToast('Сначала войдите через Google.', true);
      return false;
    }

    currentUser.nickname = nickInput;
    currentUser.status = statusInput;

    localStorage.setItem('chat_nickname', currentUser.nickname);
    localStorage.setItem('chat_status', currentUser.status);

    startApp();
    return false;
  };'''

          if old_handle not in text:
              raise SystemExit('handleLogin block was not found; aborting without changes')
          text = text.replace(old_handle, new_handle, 1)

          old_init = '''  function initAuth() {
    if (!(isCloudEnabled && auth)) {
      checkLoginState();
      return;
    }
    onAuthStateChanged(auth, (user) => {
      if (user && !user.isAnonymous) {
        currentUser.uid = user.uid;
        localStorage.setItem('chat_uid', user.uid);
        if (!currentUser.nickname) {
          currentUser.nickname = user.displayName || 'Игрок';
          localStorage.setItem('chat_nickname', currentUser.nickname);
        }
        document.getElementById('auth-nickname').value = currentUser.nickname;
        checkLoginState();
      }
      // Если не вошли через Google, остаётся экран входа
    });
  }'''

          new_init = '''  function initAuth() {
    const nicknameInput = document.getElementById('auth-nickname');
    const statusInput = document.getElementById('auth-status');
    const submitButton = document.querySelector('#auth-form button[type="submit"]');

    const setNicknameStepReady = (ready) => {
      nicknameInput.disabled = !ready;
      statusInput.disabled = !ready;
      submitButton.disabled = !ready;
      submitButton.classList.toggle('opacity-50', !ready);
      submitButton.classList.toggle('cursor-not-allowed', !ready);
    };

    if (!(isCloudEnabled && auth)) {
      setNicknameStepReady(false);
      document.getElementById('auth-nickname').value = '';
      return;
    }

    setNicknameStepReady(false);

    onAuthStateChanged(auth, (user) => {
      if (user && !user.isAnonymous) {
        currentUser.uid = user.uid;
        localStorage.setItem('chat_uid', user.uid);

        const savedNickname = localStorage.getItem('chat_nickname');
        const savedStatus = localStorage.getItem('chat_status') || 'online';

        if (savedNickname) {
          currentUser.nickname = savedNickname;
          currentUser.status = savedStatus;
          nicknameInput.value = savedNickname;
          statusInput.value = savedStatus;
          setNicknameStepReady(true);
          checkLoginState();
        } else {
          // First Google login: do NOT use the Google display name as the chat nickname.
          // The player must choose a unique chat nickname themselves.
          currentUser.nickname = '';
          currentUser.status = savedStatus;
          nicknameInput.value = '';
          setNicknameStepReady(true);
          document.getElementById('auth-screen').classList.remove('hidden');
          nicknameInput.focus();
          showToast('Google подтверждён. Теперь придумайте никнейм.');
        }
      } else {
        setNicknameStepReady(false);
        nicknameInput.value = '';
        document.getElementById('auth-screen').classList.remove('hidden');
      }
    });
  }'''

          if old_init not in text:
              raise SystemExit('initAuth block was not found; aborting without changes')
          text = text.replace(old_init, new_init, 1)

          text = text.replace(
              'Придумайте никнейм и выберите статус для общения в реальном времени.',
              'Сначала войдите через Google, затем придумайте никнейм и выберите статус для общения в реальном времени.',
              1,
          )
          text = text.replace('>Войти через Google</button>', '>1. Войти через Google</button>', 1)
          text = text.replace('>\n        Войти в чат\n      </button>', '>\n        2. Войти в чат\n      </button>', 1)

          path.write_text(text, encoding='utf-8')
          print('Authentication flow patched successfully.')

      - name: Commit patched index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix Google then nickname authentication flow"
          git push
