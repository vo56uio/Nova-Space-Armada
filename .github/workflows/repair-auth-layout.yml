name: Repair and deploy auth redesign

on:
  push:
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore parent index and apply auth redesign
        shell: bash
        run: |
          set -euo pipefail
          PARENT=493765655a5fcb6a1c8cb6330b329aaac21ddc43
          BROKEN=b3c9094023fdc0ebe6e82cfd263cb45f283bde80
          git show "$PARENT:index.html" > index.html
          git show "$BROKEN:index.html" > /tmp/broken.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          parent = Path('index.html').read_text(encoding='utf-8')
          broken = Path('/tmp/broken.html').read_text(encoding='utf-8')
          bs = broken.index('<!-- Auth Screen -->')
          be = broken.index('<!-- Main Discord Shell -->', bs)
          auth_html = broken[bs:be]
          ps = parent.index('<!-- Auth Screen (Nickname Input) -->')
          pe = parent.index('<!-- Main Discord Shell -->', ps)
          parent = parent[:ps] + auth_html + parent[pe:]
          old_import = re.search(r'import \{ getAuth,.*?firebase-auth\.js";', parent).group(0)
          new_import = re.search(r'import \{ getAuth,.*?firebase-auth\.js";', broken).group(0)
          parent = parent.replace(old_import, new_import, 1)
          parent = parent.replace('import { getFirestore, doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc }', 'import { getFirestore, doc, collection, onSnapshot, setDoc, getDoc, updateDoc, deleteDoc }', 1)
          bs = broken.index("let authMode='register';")
          be = broken.index('function startApp()', bs)
          auth_js = broken[bs:be]
          ps = parent.index('window.handleLogin = function(e)')
          pe = parent.index('function startApp()', ps)
          parent = parent[:ps] + auth_js + parent[pe:]
          Path('index.html').write_text(parent, encoding='utf-8')
          print('restored original chat and applied redesigned auth')
          PY

      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair chat and deploy email registration redesign'
          git push
