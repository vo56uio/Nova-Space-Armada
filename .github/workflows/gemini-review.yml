name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Code Changes
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      - name: Send Diff to Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os, urllib.request, json
          
          api_key = os.environ.get('GEMINI_API_KEY')
          with open('diff.txt', 'r') as f:
              diff_text = f.read()

          if not diff_text.strip():
              print('No changes found.')
              exit(0)

          prompt = f'Сделай краткий ревью этого git diff на русском языке и укажи на ошибки или потенциальные проблемы:\n\n{diff_text}'
          
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}'
          headers = {'Content-Type': 'application/json'}
          data = json.dumps({'contents': [{'parts': [{'text': prompt}]}]}).encode('utf-8')
          
          req = urllib.request.Request(url, data=data, headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode('utf-8'))
                  review = result['candidates'][0]['content']['parts'][0]['text']
                  print('=== GEMINI CODE REVIEW ===')
                  print(review)
          except Exception as e:
              print('Error calling Gemini API:', e)
          "
