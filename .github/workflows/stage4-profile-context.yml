name: Stage 4 profile and context menu

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- NOVA_STAGE4_PROFILE_CONTEXT_PATCH -->'
          if marker in s:
              print('Stage 4 patch already present')
              raise SystemExit(0)
          patch=r'''<!-- NOVA_STAGE4_PROFILE_CONTEXT_PATCH -->
          <style>
            .nova-user-card{width:min(390px,calc(100vw - 28px));background:rgba(43,45,49,.98);border:1px solid rgba(148,155,164,.22);box-shadow:0 24px 80px rgba(0,0,0,.55);backdrop-filter:blur(18px)}
            .nova-user-banner{height:92px;background:linear-gradient(135deg,#5865F2,#7c5cff 55%,#242b5f);position:relative;overflow:hidden}
            .nova-user-banner:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.22),transparent 34%)}
            .nova-profile-avatar{width:82px;height:82px;border:6px solid #2b2d31;box-shadow:0 8px 22px rgba(0,0,0,.35)}
            .nova-profile-action{background:#1e1f22;border:1px solid rgba(148,155,164,.18);transition:.15s ease}
            .nova-profile-action:hover{background:#35373c;border-color:rgba(88,101,242,.55);transform:translateY(-1px)}
          </style>
          <div id="nova-user-profile-modal" class="fixed inset-0 z-[120] hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
            <div class="nova-user-card rounded-2xl overflow-hidden text-left">
              <div class="nova-user-banner"></div>
              <div class="relative px-5 pb-5">
                <div id="nova-profile-avatar" class="nova-profile-avatar -mt-10 rounded-full bg-discord-accent flex items-center justify-center text-white text-2xl font-bold"></div>
                <button id="nova-profile-close" type="button" class="absolute right-4 top-3 w-9 h-9 rounded-full bg-black/25 text-white/80 hover:bg-black/45 hover:text-white">✕</button>
                <div class="mt-3">
                  <div class="flex items-center gap-2"><h3 id="nova-profile-name" class="text-xl font-bold text-white truncate"></h3><span id="nova-profile-owner" class="hidden text-sm" title="Владелец сервера">👑</span></div>
                  <div id="nova-profile-status" class="text-xs text-discord-muted mt-1"></div>
                  <div id="nova-profile-custom-status" class="text-sm text-gray-200 mt-3 break-words"></div>
                </div>
                <div id="nova-profile-role" class="hidden mt-3 text-xs"></div>
                <div id="nova-profile-actions" class="grid grid-cols-2 gap-2 mt-5"></div>
              </div>
            </div>
          </div>
          <script>
          (function(){
            const STATUS_LABELS={online:'В сети',idle:'Не активен',dnd:'Не беспокоить'};
            const STATUS_DOTS={online:'🟢',idle:'🟡',dnd:'🔴'};
            function novaUser(uid){if(uid===currentUser?.uid)return currentUser;return(usersData||[]).find(u=>u.uid===uid)||null;}
            function novaCurrentServer(){return(serversData||[]).find(s=>s.id===currentServerId)||null;}
            function novaMemberRole(server,uid){try{return getMemberRole(server,uid)||null}catch(e){return null;}}
            window.novaOpenUserProfile=function(uid){
              const u=novaUser(uid),modal=document.getElementById('nova-user-profile-modal');if(!u||!modal)return;
              const initial=(u.nickname||'U').charAt(0).toUpperCase();
              document.getElementById('nova-profile-avatar').textContent=initial;
              document.getElementById('nova-profile-name').textContent=u.nickname||'Пользователь';
              document.getElementById('nova-profile-status').textContent=`${STATUS_DOTS[u.status]||'⚪'} ${STATUS_LABELS[u.status]||'Неизвестно'}`;
              document.getElementById('nova-profile-custom-status').textContent=u.customStatus||'Пользовательский статус не установлен';
              const srv=novaCurrentServer(),role=srv?novaMemberRole(srv,u.uid):null,roleEl=document.getElementById('nova-profile-role'),ownerEl=document.getElementById('nova-profile-owner');
              ownerEl.classList.toggle('hidden',!(srv&&srv.ownerId===u.uid));
              if(role&&role.id!=='everyone'){roleEl.textContent=`Роль: ${role.name}`;roleEl.style.color=role.color||'#99AAB5';roleEl.classList.remove('hidden');}else roleEl.classList.add('hidden');
              const actions=document.getElementById('nova-profile-actions');
              if(u.uid===currentUser.uid)actions.innerHTML=`<button type="button" class="nova-profile-action rounded-xl px-3 py-2.5 text-sm text-white" data-nova-profile-action="edit">✏️ Редактировать</button><button type="button" class="nova-profile-action rounded-xl px-3 py-2.5 text-sm text-white" data-nova-profile-action="account">⚙️ Аккаунт</button><button type="button" class="nova-profile-action rounded-xl px-3 py-2.5 text-sm text-white" data-nova-profile-action="copy">📋 Скопировать ID</button><button type="button" class="nova-profile-action rounded-xl px-3 py-2.5 text-sm text-white" data-nova-profile-action="close">Закрыть</button>`;
              else actions.innerHTML=`<button type="button" class="nova-profile-action rounded-xl px-3 py-2.5 text-sm text-white" data-nova-profile-action="dm">✉️ Написать сообщение</button><button type="button" class="nova-profile-action rounded-xl px-3 py-2.5 text-sm text-white" data-nova-profile-action="copy">📋 Скопировать ID</button><button type="button" class="nova-profile-action rounded-xl px-3 py-2.5 text-sm text-white col-span-2" data-nova-profile-action="close">Закрыть</button>`;
              modal.classList.remove('hidden');modal.classList.add('flex');
            };
            function novaCloseProfile(){const m=document.getElementById('nova-user-profile-modal');if(m){m.classList.add('hidden');m.classList.remove('flex');}}
            document.getElementById('nova-profile-close')?.addEventListener('click',novaCloseProfile);
            document.getElementById('nova-user-profile-modal')?.addEventListener('click',e=>{if(e.target.id==='nova-user-profile-modal')novaCloseProfile();});
            document.addEventListener('click',e=>{
              const b=e.target.closest?.('[data-nova-profile-action]');if(!b)return;const action=b.dataset.novaProfileAction,name=document.getElementById('nova-profile-name')?.textContent,u=(usersData||[]).find(x=>x.nickname===name)||currentUser;
              if(action==='close')return novaCloseProfile();
              if(action==='dm'){novaCloseProfile();if(u?.uid)openDirectMessage(u.uid);}
              if(action==='copy'&&u?.uid)copyTextSilently(u.uid).then(()=>showToast('ID скопирован'));
              if(action==='edit'){novaCloseProfile();openModal('modal-profile');}
              if(action==='account'){novaCloseProfile();openModal('modal-account-settings');}
            });
            async function novaSetStatus(status){if(!currentUser)return;currentUser.status=status;localStorage.setItem('chat_status',status);updateUserProfileDisplay?.();try{await syncUserProfileCloud?.();}catch(e){}try{renderMembersSidebar?.();renderDirectMessagesList?.();}catch(e){}showToast(`Статус: ${STATUS_LABELS[status]||status}`);}
            function novaItemsForServer(srv){
              const items=[{icon:'➜',label:'Открыть сервер',action:()=>{currentView='server';currentServerId=srv.id;currentChannelId=null;document.getElementById('server-channels-container').classList.remove('hidden');document.getElementById('dm-channels-container').classList.add('hidden');renderServers();}},{icon:'👤',label:'Открыть участников',action:()=>{currentView='server';currentServerId=srv.id;renderServers();openServerSettings('members');}},{icon:'🔗',label:'Скопировать код приглашения',action:()=>copyTextSilently(srv.inviteCode||'').then(()=>showToast('Код приглашения скопирован')).catch(()=>showToast('Код приглашения отсутствует',true))}];
              if(hasServerPermission(srv,'create_invites'))items.push({icon:'📨',label:'Пригласить людей',action:()=>{currentView='server';currentServerId=srv.id;renderServers();document.getElementById('btn-server-invite')?.click();}});
              if(hasServerPermission(srv,'manage_channels'))items.push({icon:'➕',label:'Создать канал',action:()=>openModal('modal-channel')});
              if(isServerManager(srv))items.push({icon:'⚙️',label:'Настройки сервера',action:()=>openServerSettings('general')});
              if(isServerOwner(srv))items.push('separator',{icon:'🗑️',label:'Удалить сервер',danger:true,action:()=>window.deleteCurrentServer()});return items;
            }
            function novaItemsForMember(member,srv){
              const self=member.uid===currentUser.uid,owner=srv&&srv.ownerId===member.uid,items=[{icon:'👤',label:'Открыть профиль',action:()=>novaOpenUserProfile(member.uid)}];
              if(!self)items.push({icon:'✉️',label:'Написать сообщение',action:()=>openDirectMessage(member.uid)});
              items.push({icon:'📋',label:'Скопировать ID',action:()=>copyTextSilently(member.uid).then(()=>showToast('ID скопирован'))});
              if(self)items.push('separator',{icon:'🟢',label:'В сети',action:()=>novaSetStatus('online')},{icon:'🟡',label:'Не активен',action:()=>novaSetStatus('idle')},{icon:'🔴',label:'Не беспокоить',action:()=>novaSetStatus('dnd')},'separator',{icon:'⚙️',label:'Настройки аккаунта',action:()=>openModal('modal-account-settings')});
              else if(srv&&!owner){if(hasServerPermission(srv,'manage_roles'))items.push({icon:'🛡️',label:'Управлять ролями',action:()=>openServerSettings('members')});if(hasServerPermission(srv,'manage_members'))items.push({icon:'🚪',label:'Заблокировать участника',danger:true,action:()=>window.banMember(member.uid)});}
              return items;
            }
            function novaItemsForMessage(msg){
              const srv=currentView==='server'?novaCurrentServer():null,own=msg.authorId===currentUser.uid,canManage=srv&&hasServerPermission(srv,'manage_messages'),items=[{icon:'↩️',label:'Ответить',action:()=>setReplyMessage(msg.id,msg.authorName,msg.text)},{icon:'📋',label:'Копировать текст',action:()=>copyTextSilently(msg.text||'').then(()=>showToast('Текст скопирован'))}];
              if(msg.authorId)items.push({icon:'👤',label:'Открыть профиль автора',action:()=>novaOpenUserProfile(msg.authorId)});
              if(own||canManage){items.push('separator');if(own)items.push({icon:'✏️',label:'Изменить сообщение',action:()=>editMessage(msg.id)});items.push({icon:'🗑️',label:'Удалить сообщение',danger:true,action:()=>deleteMessage(msg.id)});}return items;
            }
            function novaItemsForChannel(chan,srv){
              const items=[{icon:'➜',label:'Открыть канал',action:()=>{currentView='server';currentServerId=chan.serverId;currentChannelId=chan.id;renderServers();}}];
              if(srv){items.push({icon:'📋',label:'Скопировать ID канала',action:()=>copyTextSilently(chan.id).then(()=>showToast('ID канала скопирован'))});if(hasServerPermission(srv,'manage_channels'))items.push('separator',{icon:'✏️',label:'Переименовать',action:()=>window.renameChannelPrompt(chan.id)},{icon:'🗑️',label:'Удалить канал',danger:true,action:()=>window.deleteChannel(chan.id)});}return items;
            }
            function novaItemsForDM(u){return[{icon:'👤',label:'Открыть профиль',action:()=>novaOpenUserProfile(u.uid)},{icon:'✉️',label:'Открыть личный чат',action:()=>openDirectMessage(u.uid)},{icon:'📋',label:'Скопировать ID',action:()=>copyTextSilently(u.uid).then(()=>showToast('ID скопирован'))}];}
            document.addEventListener('contextmenu',e=>{
              const target=e.target.closest?.('[data-server-id],[data-chan-id],[data-voice-id],[data-dm-user-id],[data-member-uid],[data-message-id],#user-avatar,#user-status-dot');if(!target)return;e.preventDefault();e.stopPropagation();
              if(target.matches('#user-avatar,#user-status-dot')){showContextMenu(e.clientX,e.clientY,novaItemsForMember(currentUser,novaCurrentServer()));return;}
              if(target.dataset.serverId){const s=serversData.find(x=>x.id===target.dataset.serverId);if(s)showContextMenu(e.clientX,e.clientY,novaItemsForServer(s));return;}
              if(target.dataset.chanId){const c=channelsData.find(x=>x.id===target.dataset.chanId),s=c&&serversData.find(x=>x.id===c.serverId);if(c)showContextMenu(e.clientX,e.clientY,novaItemsForChannel(c,s));return;}
              if(target.dataset.voiceId){const c=channelsData.find(x=>x.id===target.dataset.voiceId),s=c&&serversData.find(x=>x.id===c.serverId);if(c)showContextMenu(e.clientX,e.clientY,[{icon:'🔊',label:'Подключиться',action:()=>connectVoiceChannel(c.id,vcNameById(c.id))},{icon:'📋',label:'Скопировать ID канала',action:()=>copyTextSilently(c.id).then(()=>showToast('ID канала скопирован'))},...(s&&hasServerPermission(s,'manage_channels')?['separator',{icon:'✏️',label:'Переименовать',action:()=>window.renameChannelPrompt(c.id)},{icon:'🗑️',label:'Удалить канал',danger:true,action:()=>window.deleteChannel(c.id)}]:[])]);return;}
              if(target.dataset.dmUserId){const u=novaUser(target.dataset.dmUserId);if(u)showContextMenu(e.clientX,e.clientY,novaItemsForDM(u));return;}
              if(target.dataset.memberUid){const u=novaUser(target.dataset.memberUid);if(u)showContextMenu(e.clientX,e.clientY,novaItemsForMember(u,novaCurrentServer()));return;}
              if(target.dataset.messageId){const m=(messagesData||[]).find(x=>x.id===target.dataset.messageId);if(m)showContextMenu(e.clientX,e.clientY,novaItemsForMessage(m));return;}
            },true);
            document.addEventListener('click',e=>{const row=e.target.closest?.('[data-member-uid]');if(row&&!e.target.closest('button')){const uid=row.dataset.memberUid;if(uid)novaOpenUserProfile(uid);}});
          })();
          </script>
          <!-- /NOVA_STAGE4_PROFILE_CONTEXT_PATCH -->'''
          if '\n          ' in patch:
              patch='\n'.join(line[10:] if line.startswith('          ') else line for line in patch.splitlines())
          s=s.replace('</body>',patch+'\n</body>')
          p.write_text(s,encoding='utf-8')
          print('Patched index.html')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add profile cards and full context menus"
            git push
          fi
