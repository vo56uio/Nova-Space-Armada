<!doctype html>
<html lang="ru" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nova Space Armada — Ultimate Web Chat</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            discord: {
              bg: '#313338',
              surface: '#2B2D31',
              rail: '#1E1F22',
              hover: '#35373C',
              accent: '#5865F2',
              accentHover: '#4752C4',
              muted: '#949BA4',
              green: '#23A55A',
              yellow: '#F0B232',
              red: '#F23F43',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      user-select: none;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(120, 120, 120, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(120, 120, 120, 0.5);
    }
    .msg-content {
      user-select: text;
    }
    .context-menu {
      animation: contextMenuIn .12s ease-out;
      transform-origin: top left;
    }
    @keyframes contextMenuIn {
      from { opacity: 0; transform: scale(.96) translateY(-3px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-backdrop {
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body class="bg-discord-bg text-gray-100 antialiased h-[100dvh] overflow-hidden flex flex-col">

<!-- Context Menu Container -->
<div id="context-menu" class="context-menu fixed hidden z-[100] min-w-56 max-w-72 rounded-xl border border-gray-700/70 bg-discord-rail/95 backdrop-blur-xl shadow-2xl overflow-hidden py-1"></div>

<!-- Global Toast Notification -->

</div>

<!-- Modal: User Profile Card -->

    <div class="px-6 pb-6 pt-0 relative">

        U

      <div class="mt-3">
        <h3 id="profile-modal-nickname" class="text-xl font-bold text-white truncate">Никнейм</h3>
        <p id="profile-modal-tag" class="text-xs text-discord-muted truncate">@user</p>

        <div class="text-[11px] font-bold text-discord-muted uppercase tracking-wider mb-1">Статус</div>

<!-- Modal: Account Settings -->

  <div class="bg-discord-surface border border-gray-700/60 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl relative">

<!-- Firebase Module Script -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, collection, setDoc, getDoc, updateDoc, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCXKzk_xRHIVERrzrg3WV9h0p3iNhtSCbw",
  authDomain: "novaspacearmada.firebaseapp.com",
  databaseURL: "https://novaspacearmada-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "novaspacearmada",
  storageBucket: "novaspacearmada.appspot.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserData = null;
let currentChannel = 'general';
let authMode = 'login';

// Auth Elements
const authScreen = document.getElementById('auth-screen');
const appShell = document.getElementById('app-shell');
const authTabLogin = document.getElementById('auth-tab-login');
const authTabRegister = document.getElementById('auth-tab-register');
const authNicknameWrap = document.getElementById('auth-nickname-wrap');
const authConfirmWrap = document.getElementById('auth-confirm-wrap');
const authSubmit = document.getElementById('auth-submit');
const authError = document.getElementById('auth-error');

// Auth Mode Switching
authTabLogin.onclick = () => setAuthMode('login');
authTabRegister.onclick = () => setAuthMode('register');

function setAuthMode(mode) {
  authMode = mode;
  if (mode === 'login') {
    authTabLogin.className = "py-2 text-xs font-semibold rounded-lg text-white bg-discord-surface shadow";
    authTabRegister.className = "py-2 text-xs font-semibold rounded-lg text-discord-muted hover:text-white";
    authNicknameWrap.classList.add('hidden');
    authConfirmWrap.classList.add('hidden');
    authSubmit.textContent = "Войти";
  } else {
    authTabRegister.className = "py-2 text-xs font-semibold rounded-lg text-white bg-discord-surface shadow";
    authTabLogin.className = "py-2 text-xs font-semibold rounded-lg text-discord-muted hover:text-white";
    authNicknameWrap.classList.remove('hidden');
    authConfirmWrap.classList.remove('hidden');
    authSubmit.textContent = "Создать аккаунт";
  }
  authError.classList.add('hidden');
}

// Google Auth
document.getElementById('btn-google-auth').onclick = async () => {
  try {
    const provider = new GoogleAuthProvider();
    const res = await signInWithPopup(auth, provider);
    await syncUserProfile(res.user, res.user.displayName || 'Google User');
  } catch (err) {
    showAuthError(err.message);
  }
};

// Form Email/Pass Auth
document.getElementById('auth-form').onsubmit = async (e) => {
  e.preventDefault();
  authError.classList.add('hidden');

  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-password').value;
  const nick = document.getElementById('auth-nickname').value.trim();
  const pass2 = document.getElementById('auth-password-confirm').value;

  try {
    if (authMode === 'register') {
      if (!nick) return showAuthError('Укажите ваш никнейм');
      if (pass !== pass2) return showAuthError('Пароли не совпадают');
      
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await syncUserProfile(cred.user, nick);
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (err) {
    showAuthError(err.message || 'Ошибка авторизации');
  }
};

function showAuthError(msg) {
  authError.textContent = msg;
  authError.classList.remove('hidden');
}

async function syncUserProfile(user, fallbackNick) {
  const userRef = doc(db, 'artifacts', 'discord-chat-v2', 'public', 'data', 'users', user.uid);
  const snap = await getDoc(userRef);
  if (!snap.exists()) {
    await setDoc(userRef, {
      uid: user.uid,
      email: user.email || '',
      nickname: fallbackNick,
      customStatus: 'В сети',
      createdAt: Date.now()
    });
  }
}

// Global Auth Listener
onAuthStateChanged(auth, async (user) => {
  if (user) {
    authScreen.classList.add('hidden');
    appShell.classList.remove('hidden');

    const userRef = doc(db, 'artifacts', 'discord-chat-v2', 'public', 'data', 'users', user.uid);
    onSnapshot(userRef, (snap) => {
      if (snap.exists()) {
        currentUserData = snap.data();
        updateUserBarUI();
      }
    });

    loadChannelMessages(currentChannel);
  } else {
    authScreen.classList.remove('hidden');
    appShell.classList.add('hidden');
  }
});

function updateUserBarUI() {
  if (!currentUserData) return;
  const nick = currentUserData.nickname || 'Пользователь';
  document.getElementById('user-display-name').textContent = nick;
  document.getElementById('user-avatar').textContent = nick[0].toUpperCase();
  document.getElementById('user-status-text').textContent = currentUserData.customStatus || 'В сети';
}

// Channel Switching
document.querySelectorAll('.channel-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('bg-discord-hover', 'text-white'));
    btn.classList.add('bg-discord-hover', 'text-white');
    currentChannel = btn.dataset.channel;
    document.getElementById('current-channel-title').textContent = currentChannel;
    loadChannelMessages(currentChannel);
  };
});

// Messages Listener
let unsubscribeMessages = null;
function loadChannelMessages(channelId) {
  if (unsubscribeMessages) unsubscribeMessages();

  const q = query(
    collection(db, 'artifacts', 'discord-chat-v2', 'public', 'data', 'channels', channelId, 'messages'),
    orderBy('createdAt', 'asc')
  );

  unsubscribeMessages = onSnapshot(q, (snapshot) => {
    const feed = document.getElementById('message-feed');
    feed.innerHTML = '';
    snapshot.forEach((docSnap) => {
      const msg = docSnap.data();
      const div = document.createElement('div');
      div.className = 'flex gap-3 hover:bg-black/10 p-1.5 rounded-lg transition group';
      
      const avatarText = (msg.author || 'U')[0].toUpperCase();
      
      div.innerHTML = `
        <div class="w-9 h-9 rounded-full bg-discord-accent flex items-center justify-center font-bold text-white text-xs flex-shrink-0 cursor-pointer user-profile-trigger" data-uid="${msg.uid}">
          ${avatarText}
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-white text-sm cursor-pointer hover:underline user-profile-trigger" data-uid="${msg.uid}">${msg.author || 'Аноним'}</span>
            <span class="text-[10px] text-discord-muted">${msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}</span>
          </div>
          <div class="text-sm text-gray-200 msg-content mt-0.5">${msg.text}</div>
        </div>
      `;
      feed.appendChild(div);
    });
    feed.scrollTop = feed.scrollHeight;

    // Attach profile modal click triggers
    feed.querySelectorAll('.user-profile-trigger').forEach(el => {
      el.onclick = () => openProfileModal(el.dataset.uid);
    });
  });
}

// Message Sending
document.getElementById('chat-form').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !auth.currentUser) return;

  await addDoc(collection(db, 'artifacts', 'discord-chat-v2', 'public', 'data', 'channels', currentChannel, 'messages'), {
    text,
    author: currentUserData?.nickname || 'Пользователь',
    uid: auth.currentUser.uid,
    createdAt: Date.now()
  });

  input.value = '';
};

// Modals: Profile
const profileModal = document.getElementById('profile-modal');
async function openProfileModal(uid) {
  if (!uid) return;
  const snap = await getDoc(doc(db, 'artifacts', 'discord-chat-v2', 'public', 'data', 'users', uid));
  const data = snap.exists() ? snap.data() : { nickname: 'Пользователь', customStatus: 'В сети' };

  const nick = data.nickname || 'Пользователь';
  document.getElementById('profile-modal-nickname').textContent = nick;
  document.getElementById('profile-modal-tag').textContent = `@${nick.toLowerCase().replace(/\s+/g, '')}`;
  document.getElementById('profile-modal-avatar').textContent = nick[0].toUpperCase();
  document.getElementById('profile-modal-status').textContent = data.customStatus || 'В сети';

  // Hide PM button if opening own profile
  const btnPm = document.getElementById('btn-pm-send-dm');
  if (auth.currentUser && auth.currentUser.uid === uid) {
    btnPm.classList.add('hidden');
  } else {
    btnPm.classList.remove('hidden');
  }

  profileModal.classList.remove('hidden');
}

document.getElementById('close-profile-modal').onclick = () => profileModal.classList.add('hidden');
document.getElementById('user-bar-click').onclick = () => {
  if (auth.currentUser) openProfileModal(auth.currentUser.uid);
};

// Modals: Account Settings
const settingsModal = document.getElementById('settings-modal');
document.getElementById('btn-open-settings').onclick = () => {
  if (currentUserData) {
    document.getElementById('settings-nickname').value = currentUserData.nickname || '';
    document.getElementById('settings-status').value = currentUserData.customStatus || '';
  }
  settingsModal.classList.remove('hidden');
};

document.getElementById('close-settings-modal').onclick = () => settingsModal.classList.add('hidden');
document.getElementById('btn-cancel-settings').onclick = () => settingsModal.classList.add('hidden');

document.getElementById('settings-form').onsubmit = async (e) => {
  e.preventDefault();
  if (!auth.currentUser) return;

  const newNick = document.getElementById('settings-nickname').value.trim();
  const newStatus = document.getElementById('settings-status').value.trim();

  await updateDoc(doc(db, 'artifacts', 'discord-chat-v2', 'public', 'data', 'users', auth.currentUser.uid), {
    nickname: newNick,
    customStatus: newStatus
  });

  settingsModal.classList.add('hidden');
  showToast('Профиль успешно обновлен!');
};

// Logout
document.getElementById('btn-logout').onclick = () => signOut(auth);

// Toast helper
function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  toast.classList.remove('-translate-y-12', 'opacity-0');
  toast.classList.add('translate-y-0', 'opacity-100');
  setTimeout(() => {
    toast.classList.add('-translate-y-12', 'opacity-0');
    toast.classList.remove('translate-y-0', 'opacity-100');
  }, 2500);
}
</script>
</body>
</html>
